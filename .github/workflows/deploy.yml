name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The escape hatch for when a push never becomes a run. GitHub sheds webhook
  # deliveries under load rather than queueing them, and a shed delivery is
  # never redelivered — so main can end up sitting at a commit that has no
  # workflow run, with nothing left to re-run and no way to ask for one. That
  # is not hypothetical: during the 2026-08-06 Actions incident deliveries were
  # throttled to roughly 15%, main's head went unbuilt, and the only trigger
  # available was pushing empty commits until one of them got through. It took
  # three. This is the button that would have replaced them.
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant. Let main
# finish, though: cancelling it would leave whatever it was deploying half done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only for every job that does not say otherwise, which is the one that
# matters: `test` runs `npm ci`, and `npm ci` runs whatever lifecycle scripts
# the pull request's own package.json and lockfile ask for. That is
# attacker-controlled code, so the token it holds must be able to do nothing.
# The write scope the preview comment needs is granted on `deploy` alone.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # `npm run build` is `tsc -b && vite build`, so this typechecks as well as
      # bundling. The deploy job ships this exact dist rather than rebuilding.
      - run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Replaces the top-level block for this job rather than adding to it, so
    # `contents: read` has to be restated. This job never runs code from the
    # pull request — it checks out, downloads the already-built dist and hands
    # it to wrangler — which is what makes the write scope safe to grant here
    # and nowhere else.
    permissions:
      contents: read
      pull-requests: write
    # Deploys need the Cloudflare secrets, and GitHub withholds those from two
    # kinds of run: pull requests opened from forks, and anything Dependabot
    # triggers — its runs read a separate secrets store, so ours arrive empty.
    # Dependabot's branches live in this repo, so the fork check alone lets them
    # through and wrangler fails on a blank token. Both still get the test job,
    # which is the half that actually vets a dependency bump.
    #
    # `workflow_dispatch` has to be named here explicitly, and forgetting it is
    # the quiet way to make the trigger useless: a manual run matches neither of
    # the other arms — the event is not `push`, and `github.event.pull_request`
    # is null so the fork comparison comes out false — so the button would run
    # the tests and then skip the deploy, which is the one thing it exists to
    # do. Dispatching is safe to allow because it needs write access, and the
    # branch still decides where the build lands: only a dispatch on main gets
    # `--branch=main` and reaches production, and anything else gets a preview.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    # Gives the deploy a tracked URL in the GitHub UI. Only possible because the
    # repo is public — GitHub Free allows environments on public repos only.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      # --branch is what Cloudflare uses to tell production from preview: it
      # matches the project's production branch on main, and everything else
      # lands on a preview URL that stays up on its own.
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=mtga-limited-ev
            --branch=${{ github.head_ref || github.ref_name }}

      - run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"

      # The step summary and the Environments panel both hold the preview URL
      # already, and both are places a reviewer has to go looking. This puts it
      # in the timeline instead.
      #
      # `gh` rather than a commenting action: it is already on the runner, and
      # a fourth third-party action would be a fourth SHA to keep pinned.
      #
      # --edit-last rewrites this job's own previous comment instead of adding
      # one per push, so a branch that is pushed ten times still has a single
      # comment showing where the preview is now. --create-if-none covers the
      # first run, when there is nothing to edit.
      - name: Comment the preview URL on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # The alias tracks the branch, so it keeps working as review fixes
          # land; the hash URL is pinned to this one commit. Older wrangler
          # cannot report the alias, hence the fallback.
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          EXACT: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "**Preview:** $ALIAS"
            echo
            echo "Pinned to \`$GITHUB_SHA\`: $EXACT"
          } > comment.md
          gh pr comment "$PR" --body-file comment.md --edit-last --create-if-none

  # The box-price feed Worker (worker/), which serves /api/box-prices on the
  # production origin and refreshes its KV data on a daily cron. Main only:
  # its route lives on the custom domain, so there is nothing preview-shaped
  # to deploy — previews fall back to the constants baked into the app, by
  # design. Deploying on every main push is idempotent and takes seconds;
  # gating it on a paths filter would just add a way for the workflow file and
  # reality to disagree.
  deploy-worker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The worker imports its source-reading modules from
      # scripts/refresh-constants/, so it needs the checkout, not just its own
      # directory — wrangler bundles the relative imports at deploy time.
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
